name: baseport

services:
  baseport:
    image: ghcr.io/baseporteu/baseport:${BASEPORT_TAG:-latest}
    container_name: baseport
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${BASEPORT_PORT:-5000}:5000"
    volumes:
      - baseport-data:/data

volumes:
  baseport-data:
