name: baseport

services:
  baseport:
    image: ghcr.io/baseporteu/baseport:${BASEPORT_TAG:-latest}
    container_name: baseport
    restart: unless-stopped
    environment:
      Baseport__ConnectionString: "${BASEPORT_CONNECTION_STRING:-Data Source=/data/baseport.db}"
      Baseport__TrustForwardedHeaders: "${BASEPORT_TRUST_FORWARDED_HEADERS:-false}"
      Baseport__AdminAddress: "${BASEPORT_ADMIN_ADDRESS:-}"
    ports:
      - "${BASEPORT_PORT:-5000}:5000"
    volumes:
      - baseport-data:/data

volumes:
  baseport-data:
