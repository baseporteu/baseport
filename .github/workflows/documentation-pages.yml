name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Documentation/docs/**'
      - '.github/workflows/documentation-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: baseport

    - name: Resolve latest Bark 
      id: bark
      run: |
        tag=$(git ls-remote --tags --refs --sort=-v:refname \
          https://github.com/melosso/bark.git | head -1 | sed 's#.*/##')
        [ -n "$tag" ] || { echo "::error::No tags found on melosso/bark"; exit 1; }
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Building docs with Bark $tag"

    - name: Checkout Bark
      uses: actions/checkout@v4
      with:
        repository: melosso/bark
        ref: ${{ steps.bark.outputs.tag }}
        path: bark

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Bark
      run: |
        dotnet publish ${{ github.workspace }}/bark/Bark/src/Bark/Bark.csproj \
          -c Release -o ${{ github.workspace }}/publish

    - name: Copy docs
      run: |
        rm -rf ${{ github.workspace }}/publish/docs
        cp -r ${{ github.workspace }}/baseport/Documentation/docs ${{ github.workspace }}/publish/docs

    - name: Generate static site
      working-directory: ${{ github.workspace }}/publish
      run: |
        ./Bark --export ${{ github.workspace }}/site \
          --base-url https://baseporteu.github.io \
          --base-path /baseport

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '${{ github.workspace }}/site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
