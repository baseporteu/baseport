<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none">
  <g clip-path="url(#bp-fav-clip)">
    <rect width="20" height="20" fill="#000" rx="5.5"/>
    <rect width="20" height="20" fill="url(#bp-fav-gradient)" fill-opacity="0.2" rx="5.5"/>
    <g filter="url(#bp-fav-blur-1)" opacity="0.3"><circle cx="16" cy="17" r="6" fill="#FF64B4" fill-opacity="0.671"/></g>
    <g filter="url(#bp-fav-blur-2)" opacity="0.1"><circle cx="16" cy="16" r="6" fill="#FF64B4" fill-opacity="0.671"/></g>
    <g filter="url(#bp-fav-blur-3)" opacity="0.4"><circle cx="17" cy="19" r="6" fill="#FF64B4" fill-opacity="0.671"/></g>
    <rect width="20" height="20" fill="#FF64B4" fill-opacity="0.15" rx="5.5"/>
    <g style="mix-blend-mode:hard-light"><rect width="20" height="20" fill="#6A62FF" fill-opacity="0.1" rx="5.5"/></g>
  </g>
  <rect width="19" height="19" x="0.5" y="0.5" stroke="#FDFDFD" stroke-opacity="0.1" rx="5"/>
  <g stroke="#FDFDFD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4v12"/>
    <path d="M7 4h4.5a3 3 0 0 1 0 6H7"/>
    <path d="M7 10h5a3 3 0 0 1 0 6H7"/>
  </g>
  <defs>
    <filter id="bp-fav-blur-1" width="32" height="32" x="0" y="1" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/><feGaussianBlur result="effect1_foregroundBlur" stdDeviation="5"/>
    </filter>
    <filter id="bp-fav-blur-2" width="22" height="22" x="5" y="5" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/><feGaussianBlur result="effect1_foregroundBlur" stdDeviation="5"/>
    </filter>
    <filter id="bp-fav-blur-3" width="28" height="28" x="3" y="5" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/><feGaussianBlur result="effect1_foregroundBlur" stdDeviation="5"/>
    </filter>
    <linearGradient id="bp-fav-gradient" x1="10" y1="0" x2="10" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF64B4"/>
      <stop offset="1" stop-color="#6A62FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bp-fav-clip"><rect width="20" height="20" rx="5.5"/></clipPath>
  </defs>
</svg>
