<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='color-scheme' content='light dark'>
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('baseport.theme'); } catch (e) {}
            var dark = stored ? stored === 'dark'
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <title>Sign in</title>
    <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
    <link rel='stylesheet' href='/ui.css'>
    <link rel='stylesheet' href='/app.css'>
</head>
<body>
    <div class='signin-theme'>
        <button type='button' class='topbar-btn' onclick='toggleTheme()' title='Toggle theme'>
            <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='20' height='20'><path d='M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7-.7.7m0 11.4.7.7m-12.1-.7-.7.7'></path></svg>
        </button>
    </div>

    <main class='signin'>
        <div class='signin-mark' role='img' aria-label='Baseport'></div>

        <form class='signin-panel' onsubmit='return bpSignIn(event)'>
            <header class='signin-header'>
                <h1>Sign in</h1>
                <p>Use the account you registered with.</p>
            </header>

            <label class='field-label' for='authHandle'>Email or username
                <input type='text' id='authHandle' class='input' autocomplete='username' required autofocus>
            </label>

            <label class='field-label' for='authPassword'>Password
                <input type='password' id='authPassword' class='input' autocomplete='current-password' required>
            </label>

            <button type='submit' class='btn btn-block signin-submit'>Sign in</button>
            <!--__SIGNUP__--><p class='signin-aside'>No account yet? <a href='/auth/register'>Create one</a>.</p><!--__/SIGNUP__-->
        </form>

        <div class='signin-sso' id='ssoBlock' hidden>
            <p class='signin-or'>or</p>
            <div class='signin-providers' id='ssoProviders'></div>
        </div>
    </main>

    <!--__BOOTSTRAP__-->
    <script src='/ui.js'></script>
    <script src='/js/sso.js'></script>
    <script src='/js/userauth.js'></script>
    <script>
        bpGuestOnly();
        ssoInit('public');
    </script>
</body>
</html>
