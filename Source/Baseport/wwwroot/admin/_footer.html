        </main>
    </div>

    <div class='sheet-overlay' id='sheetOverlay' onclick='closeSheet()'></div>
    <aside class='sheet' id='sheet' aria-hidden='true'>
        <div class='sheet-head'>
            <h3 id='sheetTitle'></h3>
            <button class='btn btn-ghost btn-sm' onclick='closeSheet()' aria-label='Close panel'>✕</button>
        </div>
        <div class='sheet-body' id='sheetBody'></div>
        <div class='sheet-actions' id='sheetActions'></div>
    </aside>

    <div class='modal-overlay' id='modalOverlay'>
        <div class='modal' role='dialog' aria-modal='true'>
            <h3 id='modalTitle'>Confirm</h3>
            <p id='modalMsg'></p>
            <div class='modal-actions'>
                <button class='btn btn-outline' id='modalCancel'>Cancel</button>
                <button class='btn' id='modalOk'>Confirm</button>
            </div>
        </div>
    </div>
