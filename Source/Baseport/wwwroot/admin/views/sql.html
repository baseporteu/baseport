            <div id='sqlView' class='view'>
                <div class='page-header'>
                    <div>
                        <h1>SQL Console</h1>
                        <p class='page-sub'>Run your read-only queries against your data store. Every table is selectable by name, with its fields as columns.</p>
                    </div>
                    <div class='page-actions'>
                        <button class='icon-btn' onclick='newQuery()' title='New query'><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 5v14M5 12h14'/></svg></button>
                        <span id='sqlQueryActions' class='hidden'>
                            <button class='icon-btn danger' title='Delete query' onclick='deleteCurrentQuery()'><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 6h18'/><path d='M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6'/><path d='M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2'/></svg></button>
                            <button class='btn btn-outline' onclick='renameCurrentQuery()' title='Rename query'>Rename</button>
                        </span>
                        <button class='btn btn-outline' onclick='saveQuery()' title='Save (Ctrl+S)'>Save</button>
                        <button class='btn' onclick='runSql()' title='Execute (Ctrl+Enter)'>Execute</button>
                    </div>
                </div>
                <div class='sql-layout'>
                    <div class='card sql-main'>
                        <div class='sql-bar'>
                            <span class='sql-name' id='sqlQueryName'>New Query</span>
                        </div>
                        <textarea 
                            id='sqlInput' 
                            class='input textarea sql-editor' 
                            spellcheck='false' 
                            rows="5"
                            placeholder='SELECT c.Country, COUNT(*) AS Orders, ROUND(SUM(o.Total), 2) AS Revenue FROM Orders o JOIN Customers c ON c.id = o.Customer GROUP BY c.Country ORDER BY Revenue DESC;'>
                        </textarea>
                        <div id='sqlResult' class='sql-result hidden'></div>
                        <div id='sqlNoData' class='sql-nodata hidden'>No data</div>
                        <div id='sqlStatus' class='field-hint'></div>
                    </div>
                </div>
            </div>
