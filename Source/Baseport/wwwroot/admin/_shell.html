<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='color-scheme' content='light dark'>
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('baseport.theme'); } catch (e) {}
            var dark = stored ? stored === 'dark'
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
    <title>Baseport</title>
    <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='/ui.css'>
    <link rel='stylesheet' href='/vendor/codemirror-bundle.css'>
    <link rel='stylesheet' href='/app.css'>
</head>
<body>
    <div class='shell' id='appShell' hidden>
        <aside class='rail' id='rail'>
            <nav class='rail-nav'>
                <button type='button' class='rail-logo' onclick='toggleRail()' title='Toggle sidebar'>
                    <span class='rail-logo-mark'>
                        <svg viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg' class='rail-logo-tile' aria-hidden='true'>
                            <g clip-path='url(#bp-rail-clip)'>
                                <rect width='20' height='20' fill='#000' rx='5.5'/>
                                <rect width='20' height='20' fill='url(#bp-rail-gradient)' fill-opacity='0.2' rx='5.5'/>
                                <g filter='url(#bp-rail-blur-1)' opacity='0.3'><circle cx='16' cy='17' r='6' fill='#FF64B4' fill-opacity='0.671'/></g>
                                <g filter='url(#bp-rail-blur-2)' opacity='0.1'><circle cx='16' cy='16' r='6' fill='#FF64B4' fill-opacity='0.671'/></g>
                                <g filter='url(#bp-rail-blur-3)' opacity='0.4'><circle cx='17' cy='19' r='6' fill='#FF64B4' fill-opacity='0.671'/></g>
                                <rect width='20' height='20' fill='#FF64B4' fill-opacity='0.15' rx='5.5'/>
                                <g style='mix-blend-mode:hard-light'><rect width='20' height='20' fill='#6A62FF' fill-opacity='0.1' rx='5.5'/></g>
                            </g>
                            <rect width='19' height='19' x='0.5' y='0.5' stroke='#FDFDFD' stroke-opacity='0.1' rx='5'/>
                            <defs>
                                <filter id='bp-rail-blur-1' width='32' height='32' x='0' y='1' color-interpolation-filters='sRGB' filterUnits='userSpaceOnUse'>
                                    <feFlood flood-opacity='0' result='BackgroundImageFix'/><feBlend in='SourceGraphic' in2='BackgroundImageFix' result='shape'/><feGaussianBlur result='effect1_foregroundBlur' stdDeviation='5'/>
                                </filter>
                                <filter id='bp-rail-blur-2' width='22' height='22' x='5' y='5' color-interpolation-filters='sRGB' filterUnits='userSpaceOnUse'>
                                    <feFlood flood-opacity='0' result='BackgroundImageFix'/><feBlend in='SourceGraphic' in2='BackgroundImageFix' result='shape'/><feGaussianBlur result='effect1_foregroundBlur' stdDeviation='5'/>
                                </filter>
                                <filter id='bp-rail-blur-3' width='28' height='28' x='3' y='5' color-interpolation-filters='sRGB' filterUnits='userSpaceOnUse'>
                                    <feFlood flood-opacity='0' result='BackgroundImageFix'/><feBlend in='SourceGraphic' in2='BackgroundImageFix' result='shape'/><feGaussianBlur result='effect1_foregroundBlur' stdDeviation='5'/>
                                </filter>
                                <linearGradient id='bp-rail-gradient' x1='10' y1='0' x2='10' y2='20' gradientUnits='userSpaceOnUse'>
                                    <stop stop-color='#FF64B4'/><stop offset='1' stop-color='#6A62FF' stop-opacity='0'/>
                                </linearGradient>
                                <clipPath id='bp-rail-clip'><rect width='20' height='20' rx='5.5'/></clipPath>
                            </defs>
                        </svg>
                        <svg class='rail-logo-icon' width='12' height='12' viewBox='0 0 20 20' fill='none' stroke='#FDFDFD' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>
                            <path d='M5 4v12'/><path d='M7 4h4.5a3 3 0 0 1 0 6H7'/><path d='M7 10h5a3 3 0 0 1 0 6H7'/>
                        </svg>
                    </span><span class='rail-logo-name'>Baseport</span>
                </button>
                <button type='button' class='rail-btn active' data-section='tables' onclick='goSection("tables")' ondblclick='toggleRail()' title='Tables'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M3 9h18M9 21V9'/></svg>
                    <span class='rail-label'>Tables</span>
                </button>
                <button type='button' class='rail-btn' data-section='forms' onclick='goSection("forms")' ondblclick='toggleRail()' title='Forms'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><rect x='4' y='3' width='16' height='18' rx='2'/><path d='M8 8h8M8 12h8M8 16h4'/></svg>
                    <span class='rail-label'>Forms</span>
                </button>
                <button type='button' class='rail-btn' data-section='sql' onclick='goSection("sql")' ondblclick='toggleRail()' title='SQL console'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><path d='M17 3a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 1 0 0-5.6M3 21l9-9M12.2 6.3 11 5l-3.5 3.5 1.2 1.2z'/><path d='M5 3l1.5 1.5M5 3 3.5 4.5M12.8 17.3 14 18.6l3.5-3.5-1.2-1.2zM14.5 12.5h2M17 21l-1.5-1.5M17 21l1.5-1.5'/></svg>
                    <span class='rail-label'>SQL</span>
                </button>
                <button type='button' class='rail-btn' data-section='schema' onclick='goSection("schema")' ondblclick='toggleRail()' title='Schema'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><circle cx='12' cy='5' r='2'/><circle cx='5' cy='19' r='2'/><circle cx='19' cy='19' r='2'/><path d='M12 7v6M5 17l2.5-4M19 17l-2.5-4M12 13l-4.5 4M12 13l4.5 4'/></svg>
                    <span class='rail-label'>Schema</span>
                </button>
                <button type='button' class='rail-btn' data-section='auth' onclick='goSection("auth")' ondblclick='toggleRail()' title='Users'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><path d='M5 7a4 4 0 1 0 8 0 4 4 0 1 0-8 0M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.85'/></svg>
                    <span class='rail-label'>Users</span>
                </button>
                <button type='button' class='rail-btn' data-section='logs' onclick='goSection("logs")' ondblclick='toggleRail()' title='Activity log'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><path d='m4 16 6-7 5 5 5-6'/><path d='M15 14a1 1 0 1 0 2 0 1 1 0 1 0-2 0M9 9a1 1 0 1 0 2 0 1 1 0 1 0-2 0M3 16a1 1 0 1 0 2 0 1 1 0 1 0-2 0M19 8a1 1 0 1 0 2 0 1 1 0 1 0-2 0'/></svg>
                    <span class='rail-label'>Logs</span>
                </button>
                <button type='button' class='rail-btn' data-section='settings' onclick='goSection("settings")' ondblclick='toggleRail()' title='Settings'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'/></svg>
                    <span class='rail-label'>Settings</span>
                </button>
            </nav>
            <div class='rail-footer'>
                <button type='button' class='rail-btn' onclick='toggleTheme()' title='Toggle theme'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><path d='M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7-.7.7m0 11.4.7.7m-12.1-.7-.7.7'/></svg>
                </button>
                <button type='button' class='rail-btn' onclick='signOut()' title='Sign out'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><path d='M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2M9 12h12l-3-3m3 3-3 3'/></svg>
                </button>
                <button type='button' class='rail-btn' onclick="window.open('/docs', '_blank', 'noopener')" title='API reference'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='22' height='22'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6M9 13h6M9 17h4'/></svg>
                </button>
                <div class='rail-avatar' id='railAvatar' title='Signed in'>A</div>
                <div class='rail-version'>v0.1.0</div>
            </div>
        </aside>

        <aside class='sidebar' id='sidebar'>
            <nav class='side-nav'>
                <div class='nav-head'>
                    <h3 class='nav-section-title' id='sidebarTitle'>Tables</h3>
                    <div id='sidebarAction'></div>
                </div>
                <div id='sidebarAdd'></div>
                <ul id='sidebarList' class='nav-list'></ul>
                <p class='muted empty-hint hidden' id='sidebarEmpty'></p>
            </nav>
        </aside>

        <main class='main'>
