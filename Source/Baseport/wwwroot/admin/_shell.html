<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='color-scheme' content='light dark'>
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('baseport.theme'); } catch (e) {}
            var dark = stored ? stored === 'dark'
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
    <title>Baseport</title>
    <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
    <link rel='stylesheet' href='/ui.css'>
    <link rel='stylesheet' href='/vendor/codemirror-bundle.css'>
    <link rel='stylesheet' href='/app.css'>
</head>
<body>
    <div class='shell' id='appShell' hidden>
        <aside class='sidebar' id='sidebar'>
            <div class='sidebar-brand'>
                <button type='button' class='brand-trigger' onclick='toggleSidebar()' title='Toggle sidebar' aria-expanded='true'>
                    <span class='brand-mark'>
                        <svg viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg' class='brand-tile' aria-hidden='true'>
                            <g clip-path='url(#bp-brand-clip)'>
                                <rect width='20' height='20' fill='#000' rx='5.5'/>
                                <rect width='20' height='20' fill='url(#bp-brand-gradient)' fill-opacity='0.2' rx='5.5'/>
                                <g filter='url(#bp-brand-blur-1)' opacity='0.3'><circle cx='16' cy='17' r='6' fill='#FF64B4' fill-opacity='0.671'/></g>
                                <g filter='url(#bp-brand-blur-2)' opacity='0.1'><circle cx='16' cy='16' r='6' fill='#FF64B4' fill-opacity='0.671'/></g>
                                <g filter='url(#bp-brand-blur-3)' opacity='0.4'><circle cx='17' cy='19' r='6' fill='#FF64B4' fill-opacity='0.671'/></g>
                                <rect width='20' height='20' fill='#FF64B4' fill-opacity='0.15' rx='5.5'/>
                                <g style='mix-blend-mode:hard-light'><rect width='20' height='20' fill='#6A62FF' fill-opacity='0.1' rx='5.5'/></g>
                            </g>
                            <rect width='19' height='19' x='0.5' y='0.5' stroke='#FDFDFD' stroke-opacity='0.1' rx='5'/>
                            <defs>
                                <filter id='bp-brand-blur-1' width='32' height='32' x='0' y='1' color-interpolation-filters='sRGB' filterUnits='userSpaceOnUse'>
                                    <feFlood flood-opacity='0' result='BackgroundImageFix'/><feBlend in='SourceGraphic' in2='BackgroundImageFix' result='shape'/><feGaussianBlur result='effect1_foregroundBlur' stdDeviation='5'/>
                                </filter>
                                <filter id='bp-brand-blur-2' width='22' height='22' x='5' y='5' color-interpolation-filters='sRGB' filterUnits='userSpaceOnUse'>
                                    <feFlood flood-opacity='0' result='BackgroundImageFix'/><feBlend in='SourceGraphic' in2='BackgroundImageFix' result='shape'/><feGaussianBlur result='effect1_foregroundBlur' stdDeviation='5'/>
                                </filter>
                                <filter id='bp-brand-blur-3' width='28' height='28' x='3' y='5' color-interpolation-filters='sRGB' filterUnits='userSpaceOnUse'>
                                    <feFlood flood-opacity='0' result='BackgroundImageFix'/><feBlend in='SourceGraphic' in2='BackgroundImageFix' result='shape'/><feGaussianBlur result='effect1_foregroundBlur' stdDeviation='5'/>
                                </filter>
                                <linearGradient id='bp-brand-gradient' x1='10' y1='0' x2='10' y2='20' gradientUnits='userSpaceOnUse'>
                                    <stop stop-color='#FF64B4'/><stop offset='1' stop-color='#6A62FF' stop-opacity='0'/>
                                </linearGradient>
                                <clipPath id='bp-brand-clip'><rect width='20' height='20' rx='5.5'/></clipPath>
                            </defs>
                        </svg>
                        <svg class='brand-glyph' width='12' height='12' viewBox='0 0 20 20' fill='none' stroke='#FDFDFD' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>
                            <path d='M5 4v12'/><path d='M7 4h4.5a3 3 0 0 1 0 6H7'/><path d='M7 10h5a3 3 0 0 1 0 6H7'/>
                        </svg>
                    </span><span class='brand-name'>Baseport</span>
                    <svg class='brand-collapse' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='m9 18 6-6-6-6'/></svg>
                </button>
            </div>

            <nav class='side-nav' id='sectionNav'></nav>

            <div class='sidebar-footer'>
                <button type='button' class='account-trigger' onclick='toggleAccountMenu(event)' title='Account'>
                    <span class='avatar' id='sidebarAvatar'>A</span>
                    <span class='account-meta'>
                        <span class='account-name' id='sidebarAccountName'></span>
                        <span class='account-version'>v0.1.0</span>
                    </span>
                </button>
                <div class='account-menu hidden' id='accountMenu' role='menu' aria-label='Account'>
                    <div class='account-menu-head'>
                        <strong id='accountMenuName'></strong>
                        <span id='accountMenuEmail'></span>
                    </div>
                    <div class='account-menu-sep' role='separator'></div>
                    <div class='account-menu-nest'>
                        <button type='button' role='menuitem' id='appearanceTrigger' aria-haspopup='menu' aria-expanded='false' onclick='toggleAppearance(event)'>
                            Appearance
                            <svg class='account-menu-chevron' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='m9 18 6-6-6-6'/></svg>
                        </button>
                        <div class='account-submenu hidden' id='appearanceMenu' role='menu' aria-label='Appearance'>
                            <button type='button' role='menuitemradio' data-appearance='light' onclick='chooseAppearance("light", event)'>Light</button>
                            <button type='button' role='menuitemradio' data-appearance='dark' onclick='chooseAppearance("dark", event)'>Dark</button>
                            <button type='button' role='menuitemradio' data-appearance='system' onclick='chooseAppearance("system", event)'>System</button>
                        </div>
                    </div>
                    <div class='account-menu-sep' role='separator'></div>
                    <button type='button' role='menuitem' onclick='signOut()'>Sign out</button>
                </div>
            </div>
        </aside>

        <div class='workspace'>
            <header class='topbar'>
                <button type='button' class='topbar-trigger' onclick='toggleSidebar()' title='Toggle sidebar' aria-expanded='true'>
                    <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='20' height='20'><path d='M4 6h16M4 12h16M4 18h16'/></svg>
                </button>
                <nav class='breadcrumb' id='breadcrumb' aria-label='Breadcrumb'></nav>
                <div class='topbar-actions'>
                    <button type='button' class='topbar-btn' onclick="window.open('/docs', '_blank', 'noopener')" title='API reference'>
                        <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='20' height='20'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>
                    </button>
                    <button type='button' class='topbar-btn' onclick='toggleTheme()' title='Toggle theme'>
                        <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='20' height='20'><path d='M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7-.7.7m0 11.4.7.7m-12.1-.7-.7.7'/></svg>
                    </button>
                </div>
            </header>
            <main class='main'>
                <nav class='subbar' id='subbar' aria-label='Section' hidden></nav>
                <div class='main-content'>
