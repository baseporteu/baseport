<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='color-scheme' content='light dark'>
    <meta name='robots' content='noindex, nofollow'>
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('baseport.theme'); } catch (e) {}
            var dark = stored ? stored === 'dark'
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <title>Sign in · Baseport</title>
    <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
    <link rel='stylesheet' href='/ui.css'>
    <link rel='stylesheet' href='/app.css'>
</head>
<body>
    <div class='signin-theme'>
        <button type='button' class='topbar-btn' onclick='toggleTheme()' title='Toggle theme'>
            <svg fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' viewBox='0 0 24 24' width='20' height='20'><path d='M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7-.7.7m0 11.4.7.7m-12.1-.7-.7.7'></path></svg>
        </button>
    </div>

    <main class='signin' id='loginScreen'>
        <div class='signin-mark' role='img' aria-label='Baseport'></div>

        <form class='signin-panel' id='loginForm' onsubmit='return signIn(event)'>
            <header class='signin-header'>
                <h1 class="select-none">Sign in</h1>
                <p>The console is private. Sign in to continue.</p>
            </header>

            <div class='segmented signin-modes'>
                <button type='button' class='seg-btn active' id='tabPassword' onclick='switchAuthMode("password")'>Password</button>
                <button type='button' class='seg-btn' id='tabOtp' onclick='switchAuthMode("otp")'>One-time code</button>
            </div>

            <label class='field-label' for='loginUser'>Username
                <input type='text' id='loginUser' class='input' autocomplete='username' placeholder='admin' required autofocus>
            </label>

            <div id='passwordContainer'>
                <label class='field-label' for='loginPass'>Password
                    <input type='password' id='loginPass' class='input' autocomplete='current-password' placeholder='••••••••' required>
                </label>
            </div>

            <div id='otpContainer' hidden>
                <div id='otpCodeRow' hidden>
                    <label class='field-label' for='otpCode'>Code
                        <input type='text' id='otpCode' class='input' autocomplete='one-time-code' spellcheck='false' autocapitalize='off' placeholder='Enter the code' required>
                    </label>
                </div>
            </div>

            <button class='btn btn-block signin-submit' type='submit' id='loginBtn'>Sign in</button>

            <a href='/forgot-password' onclick='showForgot();return false' class='signin-aside'>Forgot your password?</a>
        </form>

        <div class='signin-sso' id='ssoBlock' hidden>
            <p class='signin-or'>or</p>
            <div class='signin-providers' id='ssoProviders'></div>
        </div>

        <div class='signin-panel' id='forgotCard' hidden>
            <header class='signin-header'>
                <h1 class="select-none">Forgot your password?</h1>
                <p>Please reset it from the command line using administrative credentials.</p>
            </header>
            <button type='button' class='btn btn-outline btn-block' onclick='backToLogin()'>Back to sign in</button>
        </div>

        <form class='signin-panel' id='changeCard' onsubmit='return changePassword(event)' hidden>
            <header class='signin-header'>
                <h1 class="select-none">Set a new password</h1>
                <p>This account is on a one-time password. Replace it to continue.</p>
            </header>
            <label class='field-label' for='curPass'>Current password
                <input type='password' id='curPass' class='input' autocomplete='current-password' maxlength='128' required>
            </label>
            <label class='field-label' for='newPass'>New password
                <input type='password' id='newPass' class='input' autocomplete='new-password' minlength='10' maxlength='128' required>
            </label>
            <label class='field-label' for='newPass2'>Confirm new password
                <input type='password' id='newPass2' class='input' autocomplete='new-password' minlength='10' maxlength='128' required>
            </label>
            <p class='field-hint invalid hidden' id='changeHint'></p>
            <button class='btn btn-block signin-submit' type='submit'>Set password</button>
            <button class='btn btn-ghost btn-block' type='button' onclick='signOut()'>Cancel</button>
        </form>

        <footer class='signin-footer'>
            <p class="select-none">Licensed under EUPL 1.2</p>
        </footer>
    </main>

    <!--__BOOTSTRAP__-->
    <script src='/ui.js'></script>
    <script src='/js/sso.js'></script>
    <script src='/js/auth.js'></script>
</body>
</html>
